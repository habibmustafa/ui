# SonarCloud automatic analysis settings.
#
# Without this file everything in the repository is analysed as source code,
# including the golden HTML snapshots in tests/golden/. Those are test fixtures that
# are meant to look alike, and they made up most of the "duplication on new code".
sonar.sources=src,playground,scripts
sonar.tests=tests

# Written by `npm run api:generate`, not by hand.
sonar.exclusions=playground/generated/**
