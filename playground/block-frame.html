<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Block preview</title>
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <style>
      @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin-v5.3.0.woff2) format('woff2')}
      @font-face{font-family:'Source Code Pro';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/source-code-pro-latin-v5.3.0.woff2) format('woff2')}
      @font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/fonts/archivo-latin-v5.3.0.woff2) format('woff2')}
    </style>
    <script>
      try {
        var theme = localStorage.getItem('theme') || 'system';
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/playground/block-frame-entry.tsx"></script>
  </body>
</html>
