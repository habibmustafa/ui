<!doctype html>
<html lang="en" data-theme="light" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="ui" />
    <meta name="description" content="ui — an accessible React 19 component library built on Radix and Tailwind CSS v4." />
    <title>ui</title>
    <!--
      The design system site serves Inter and Source Code Pro through next/font;
      here they come from Google Fonts. The stacks themselves are defined in the
      library CSS (vendor/supabase/design-system-base.css).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint: the page renders straight away with the
      fallback stack (display=swap), then switches to Inter once it arrives.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Inter:wght@400;450;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Inter:wght@400;450;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap"
      />
    </noscript>
    <style>
      /* Async web-font swaps and lazily-highlighted code blocks can shift page
         height after first paint; scroll anchoring would otherwise "correct" the
         scroll position toward whatever moved under the viewport, which looks like
         a jump to the middle of the page right after a reload. */
      html {
        overflow-anchor: none;
      }
    </style>
  </head>
  <body>
    <script>
      // Apply the stored theme before first paint so a reload does not flash the
      // wrong one. ThemeProvider takes over from here.
      try {
        var stored = localStorage.getItem('theme') || 'system'
        var resolved =
          stored === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : stored
        var root = document.documentElement
        root.setAttribute('data-theme', resolved)
        root.classList.toggle('dark', resolved === 'dark')
        root.classList.toggle('light', resolved === 'light')
        root.style.colorScheme = resolved
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/playground/main.tsx"></script>
  </body>
</html>
