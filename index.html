<!doctype html>
<html lang="en" data-theme="light" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="ui" />
    <meta name="description" content="ui — an accessible React 19 component library built on Radix and Tailwind CSS v4." />
    <title>ui</title>
    <!--
      Inter, Archivo and Source Code Pro are self-hosted (public/fonts, variable woff2, latin +
      latin-ext). Serving them from our own origin skips the DNS + TLS handshake to
      Google's two font hosts, and the hashed-version filenames let them cache forever.
      The stacks themselves are defined in the library CSS
      (vendor/theme/design-system-base.css). Deliberately not preloaded: with
      font-display: swap the text paints in the fallback stack straight away, and a
      48 kB preload would compete with the JS/CSS the first paint depends on.
    -->
    <style>
      @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin-ext-v5.3.0.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
      @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin-v5.3.0.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:'Source Code Pro';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/source-code-pro-latin-ext-v5.3.0.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
      @font-face{font-family:'Source Code Pro';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/source-code-pro-latin-v5.3.0.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/fonts/archivo-latin-ext-v5.3.0.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
      @font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/fonts/archivo-latin-v5.3.0.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      /* Async web-font swaps and lazily-highlighted code blocks can shift page
         height after first paint; scroll anchoring would otherwise "correct" the
         scroll position toward whatever moved under the viewport, which looks like
         a jump to the middle of the page right after a reload. */
      html {
        overflow-anchor: none;
      }
    </style>
  </head>
  <body>
    <script>
      // Apply the stored theme before first paint so a reload does not flash the
      // wrong one. ThemeProvider takes over from here.
      try {
        var stored = localStorage.getItem('theme') || 'system'
        var resolved =
          stored === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : stored
        var root = document.documentElement
        root.setAttribute('data-theme', resolved)
        root.classList.toggle('dark', resolved === 'dark')
        root.classList.toggle('light', resolved === 'light')
        root.style.colorScheme = resolved
      } catch (e) {}
      // The theme builder's theme, when it applies to this page: the CSS it last generated
      // (cached by the app, see saveEarlyCss in playground/theme-store.ts), so a prerendered
      // page paints in the visitor's theme instead of switching to it at hydration.
      try {
        var css = localStorage.getItem('ui-theme-builder-css')
        var builder = JSON.parse(localStorage.getItem('ui-theme-builder') || '{}')
        var path = location.pathname.replace(/\/+$/, '') || '/'
        if (css && (builder.everywhere === true || path === '/' || path === '/theme' || path === '/blocks')) {
          var style = document.createElement('style')
          style.id = 'ui-theme-early'
          style.textContent = css
          document.head.appendChild(style)
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/playground/main.tsx"></script>
  </body>
</html>
