name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run lint
      - run: npm run check:classes
      - run: npm run check:api
      - run: npm run test
      - run: npm run build:playground

  # Diffs our design tokens against the live Supabase site (scripts/check-tokens.mjs) —
  # network-dependent on a third party, so it's informational here instead of blocking
  # merges on upstream downtime or a layout change. `npm run verify` still runs it
  # locally before a release.
  check-tokens:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npm run check:tokens
