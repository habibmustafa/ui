name: Publish

# Runs when a GitHub Release is published. Tag/release version must match package.json
# ("npm publish" refuses a mismatched or already-published version on its own).
#
# Uses npm Trusted Publishing (OIDC) instead of an NPM_TOKEN secret: npmjs.com is
# configured (package settings -> Trusted Publisher) to trust this exact repo +
# workflow file, so there's no long-lived token to leak, rotate, or get the type
# wrong on. Requires npm CLI >= 11.5.1, hence the explicit upgrade step -- the
# version bundled with actions/setup-node's node-version is usually older.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run verify
      - run: npm publish --provenance
